<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>부릉부릉 차 이름 맞히기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one fixed 1280×720 (16:9) screen, scaled to fit the device (Galaxy Tab S8 landscape = 1280×800).
   Every screen is landscape: car on the left, big touch buttons on the right. Single bright daytime look by choice. */
:root {
  color-scheme: light;
  --sky: #cfe9f7;
  --asphalt: #3a3f47;
  --frame: #23272e;
  --lane: #ffd23f;
  --card: #fffdf6;
  --ink: #1f2a37;
  --muted: #5b6676;
  --go: #2fa85a;
  --stop: #e2483d;
  --hyundai: #1c3f94;
  --kia: #111418;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--frame); color: var(--ink);
  font-family: var(--body); font-size: 20px;
  touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#screen {
  position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px;
  transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center;
  background: linear-gradient(var(--sky) 0 70%, var(--asphalt) 70% 100%);
  display: grid; grid-template-rows: 64px 1fr; gap: 14px; padding: 18px 28px 26px;
  overflow: hidden;
}
#screen::after { /* 도로 차선 */
  content: ""; position: absolute; left: 0; right: 0; bottom: 10px; height: 6px;
  background: repeating-linear-gradient(90deg, var(--lane) 0 60px, transparent 60px 120px); opacity: .9;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 40px; margin: 0; white-space: nowrap; }
h1 span { color: var(--stop); }
.bar { display: flex; gap: 10px; align-items: center; }
.chip { font-family: var(--display); font-size: 24px; background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; font-variant-numeric: tabular-nums; }
#app {
  position: relative; z-index: 1; min-height: 0;
  background: var(--card); border: 4px solid var(--ink); border-radius: 28px;
  padding: 26px 30px; box-shadow: 0 8px 0 rgba(0,0,0,.25);
  display: grid; overflow: hidden;
}

/* 버튼 */
button {
  font-family: var(--display); font-size: 30px; color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 18px;
  padding: 16px 12px; cursor: pointer; box-shadow: 0 6px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
button:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 4px solid var(--lane); outline-offset: 2px; }
button:disabled { cursor: default; }
.tool { font-size: 22px; padding: 8px 16px; border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.small { font-size: 22px; padding: 10px 18px; border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.primary { background: var(--lane); }
.go { background: var(--go); color: #fff; }
.big { font-size: 38px; padding: 22px 12px; }

/* 왼쪽 그림 / 오른쪽 조작 */
.split { display: grid; grid-template-columns: 1.3fr 1fr; gap: 34px; min-height: 0; }
.split > div { display: grid; gap: 16px; align-content: center; min-width: 0; min-height: 0; }
.stage {
  position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; width: 100%;
  background: linear-gradient(#f4f9fc 0 76%, #dfe6ec 76% 100%);
  display: grid; place-items: center;
}
.stage img { width: 86%; max-height: 84%; object-fit: contain; margin-top: 3%; }
.stage.drive img { animation: drive .7s cubic-bezier(.2,.8,.3,1); }
@keyframes drive { from { transform: translateX(-130%); } to { transform: none; } }
.question { font-family: var(--display); font-size: 40px; margin: 0; text-align: center; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.choices.two { grid-template-columns: 1fr; }
.choice { font-size: 36px; min-height: 112px; }
.choice.right { background: var(--go); color: #fff; }
.choice.wrong { background: var(--stop); color: #fff; animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.feedback { font-family: var(--display); font-size: 34px; text-align: center; min-height: 46px; margin: 0; }
.feedback.ok { color: var(--go); }
.feedback.no { color: var(--stop); }

/* 홈 설정 */
.seg { display: flex; gap: 10px; flex-wrap: wrap; }
.seg button { font-size: 24px; padding: 8px 18px; border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.seg button[aria-pressed="true"] { background: var(--lane); }
.setting { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 12px; }
.label { font-family: var(--display); font-size: 24px; margin: 0; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.muted { color: var(--muted); font-size: 18px; line-height: 1.5; margin: 0; }
.center { text-align: center; }
.tag { display: inline-block; font-family: var(--body); font-size: 18px; padding: 3px 14px; border-radius: 999px; color: #fff; vertical-align: middle; }
.tag.h { background: var(--hyundai); }
.tag.k { background: var(--kia); }

/* 배우기 */
.lname { font-family: var(--display); font-size: 76px; margin: 0; line-height: 1.05; }
.lnav { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 14px; }
.lnav button { font-size: 36px; min-height: 96px; }
#lstage { cursor: pointer; }

/* 전체 보기 */
.gwrap { display: grid; grid-template-rows: auto 1fr; gap: 14px; min-height: 0; }
.gallery { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; overflow-y: auto; min-height: 0; padding: 4px 4px 8px; align-content: start; touch-action: pan-y; }
.gallery figure { margin: 0; border: 3px solid var(--ink); border-radius: 14px; background: #f4f9fc; padding: 8px; display: grid; gap: 4px; text-align: center; cursor: pointer; }
.gallery img { width: 100%; aspect-ratio: 16/9; object-fit: contain; }
.gallery figcaption { font-family: var(--display); font-size: 22px; }

/* 결과 */
.stars { font-size: 96px; letter-spacing: 12px; color: var(--lane); -webkit-text-stroke: 3px var(--ink); font-family: var(--display); line-height: 1; }
.finish { display: grid; gap: 18px; align-content: center; justify-items: center; text-align: center; }
.finish .modes { width: 640px; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.credit { position: absolute; right: 30px; bottom: 22px; z-index: 2; color: #e9edf2; font-size: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .stage.drive img, .choice.wrong { animation: none; } }
</style>

<canvas id="confetti"></canvas>
<div id="screen">
  <header>
    <h1>부릉부릉 <span>차 이름</span> 맞히기</h1>
    <div class="bar">
      <span class="chip" id="hudQ" hidden>1/10</span>
      <span class="chip" id="hudScore" hidden>⭐ 0</span>
      <button class="tool primary" id="menuBtn" hidden>🏠 메뉴</button>
      <button class="tool" id="fsBtn" hidden>⛶ 전체 화면</button>
    </div>
  </header>
  <main id="app"></main>
  <p class="credit">차 이미지 출처: 다나와 자동차(auto.danawa.com)</p>
</div>

<script>
// ---------- 16:9 화면을 기기에 맞춰 키우기/줄이기 ----------
const screenEl = document.getElementById("screen");
function fit() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  screenEl.style.setProperty("--s", s);
}
addEventListener("resize", fit);
fit();

// ---------- 자동차 데이터 ----------
// cat: 비슷한 차끼리 오답 보기로 섞기 위한 분류, fam: 같은 이름 집안(아반떼 / 아반떼 N)
const CARS = [
  // 현대
  { id: "avante",    name: "아반떼",        brand: "현대", cat: "sedan", fam: "avante" },
  { id: "avante-n",  name: "아반떼 N",      brand: "현대", cat: "sedan", fam: "avante" },
  { id: "sonata",    name: "쏘나타",        brand: "현대", cat: "sedan" },
  { id: "grandeur",  name: "그랜저",        brand: "현대", cat: "sedan" },
  { id: "casper",    name: "캐스퍼",        brand: "현대", cat: "small", fam: "casper" },
  { id: "casper-ev", name: "캐스퍼 일렉트릭", brand: "현대", cat: "small", fam: "casper" },
  { id: "venue",     name: "베뉴",          brand: "현대", cat: "suv" },
  { id: "kona",      name: "코나",          brand: "현대", cat: "suv" },
  { id: "tucson",    name: "투싼",          brand: "현대", cat: "suv" },
  { id: "santafe",   name: "싼타페",        brand: "현대", cat: "bigsuv" },
  { id: "palisade",  name: "팰리세이드",    brand: "현대", cat: "bigsuv" },
  { id: "nexo",      name: "넥쏘",          brand: "현대", cat: "suv" },
  { id: "ioniq3",    name: "아이오닉 3",    brand: "현대", cat: "ev" },
  { id: "ioniq5",    name: "아이오닉 5",    brand: "현대", cat: "ev", fam: "ioniq5" },
  { id: "ioniq5-n",  name: "아이오닉 5 N",  brand: "현대", cat: "ev", fam: "ioniq5" },
  { id: "ioniq6",    name: "아이오닉 6",    brand: "현대", cat: "ev", fam: "ioniq6" },
  { id: "ioniq6-n",  name: "아이오닉 6 N",  brand: "현대", cat: "ev", fam: "ioniq6" },
  { id: "ioniq9",    name: "아이오닉 9",    brand: "현대", cat: "bigsuv" },
  { id: "staria",    name: "스타리아",      brand: "현대", cat: "van" },
  { id: "st1",       name: "ST1",           brand: "현대", cat: "van" },
  { id: "porter",    name: "포터",          brand: "현대", cat: "truck" },
  { id: "solati",    name: "쏠라티",        brand: "현대", cat: "bus" },
  { id: "county",    name: "카운티",        brand: "현대", cat: "bus" },
  { id: "mighty",    name: "마이티",        brand: "현대", cat: "truck" },
  { id: "pavise",    name: "파비스",        brand: "현대", cat: "truck" },
  // 기아
  { id: "morning",   name: "모닝",          brand: "기아", cat: "small" },
  { id: "ray",       name: "레이",          brand: "기아", cat: "small" },
  { id: "k5",        name: "K5",            brand: "기아", cat: "sedan" },
  { id: "k8",        name: "K8",            brand: "기아", cat: "sedan" },
  { id: "k9",        name: "K9",            brand: "기아", cat: "sedan" },
  { id: "seltos",    name: "셀토스",        brand: "기아", cat: "suv" },
  { id: "niro",      name: "니로",          brand: "기아", cat: "suv" },
  { id: "sportage",  name: "스포티지",      brand: "기아", cat: "suv" },
  { id: "sorento",   name: "쏘렌토",        brand: "기아", cat: "bigsuv" },
  { id: "tasman",    name: "타스만",        brand: "기아", cat: "truck" },
  { id: "carnival",  name: "카니발",        brand: "기아", cat: "van" },
  { id: "pv5",       name: "PV5",           brand: "기아", cat: "van", fam: "pv" },
  { id: "pv7",       name: "PV7",           brand: "기아", cat: "van", fam: "pv" },
  { id: "ev2",       name: "EV2",           brand: "기아", cat: "ev", fam: "ev" },
  { id: "ev3",       name: "EV3",           brand: "기아", cat: "ev", fam: "ev" },
  { id: "ev4",       name: "EV4",           brand: "기아", cat: "ev", fam: "ev" },
  { id: "ev5",       name: "EV5",           brand: "기아", cat: "ev", fam: "ev" },
  { id: "ev6",       name: "EV6",           brand: "기아", cat: "ev", fam: "ev" },
  { id: "ev9",       name: "EV9",           brand: "기아", cat: "bigsuv" },
  { id: "bongo",     name: "봉고",          brand: "기아", cat: "truck" },
];
const imgOf = c => `img/${c.id}.webp`;
CARS.forEach(c => { const i = new Image(); i.src = imgOf(c); });

// ---------- 저장 ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- 소리 ----------
let actx;
function beep(notes) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    notes.forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d); t += d * .8;
    });
  } catch {}
}
const sndRight = () => beep([[523, .15], [659, .15], [784, .3]]);
const sndWrong = () => beep([[220, .25], [180, .35]]);
// 기기에 있는 한국어 목소리 중 가장 자연스러운 것을 고르기
let koVoice = null;
function pickVoice() {
  try {
    const ko = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
    const rank = v => {
      const n = v.name;
      if (/Natural|Online|Neural/i.test(n)) return 0;   // Edge/Windows 자연스러운 음성 (SunHi, InJoon 등)
      if (/Google/i.test(n)) return 1;                   // Chrome 구글 음성
      if (/Yuna|Premium|Enhanced|Siri/i.test(n)) return 2; // 애플 고품질 음성
      if (!v.localService) return 3;
      return 4;
    };
    koVoice = ko.sort((a, b) => rank(a) - rank(b))[0] || null;
  } catch {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch {}
// 읽는 법: 알파벳은 영어 이름으로(EV → 이브이), 숫자는 영어로만(5 → 파이브)
const LETTER = { A: "에이", B: "비", C: "씨", D: "디", E: "이", F: "에프", G: "지", H: "에이치", I: "아이", J: "제이", K: "케이", L: "엘", M: "엠", N: "엔", O: "오", P: "피", Q: "큐", R: "알", S: "에스", T: "티", U: "유", V: "브이", W: "더블유", X: "엑스", Y: "와이", Z: "지" };
const DIGIT = ["제로", "원", "투", "쓰리", "포", "파이브", "식스", "세븐", "에잇", "나인"];
const speakable = t => t
  .replace(/[A-Z]+/g, w => [...w].map(c => LETTER[c]).join(""))
  .replace(/\d/g, d => " " + DIGIT[d] + " ")
  .replace(/\s+/g, " ").trim();
function say(text, force) {
  if (!settings.voice && !force) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(speakable(text));
    u.lang = "ko-KR";
    if (koVoice) u.voice = koVoice;
    u.rate = .9; u.pitch = 1.1; u.volume = 1;
    speechSynthesis.speak(u);
  } catch {}
}

// ---------- 꽃가루 ----------
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let bits = [];
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ffd23f", "#2fa85a", "#e2483d", "#3f6fd8", "#ff8fb1"];
  const running = bits.length > 0;
  for (let i = 0; i < 90; i++) bits.push({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 2, c: cols[i % 5], r: Math.random() * 6 + 4, life: 90 });
  if (!running) requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += .45; b.life--; cx.fillStyle = b.c; cx.fillRect(b.x, b.y, b.r, b.r * .6); });
  bits = bits.filter(b => b.life > 0);
  if (bits.length) requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height);
}

// ---------- 공통 ----------
const app = document.getElementById("app");
const hudQ = document.getElementById("hudQ"), hudScore = document.getElementById("hudScore");
const menuBtn = document.getElementById("menuBtn");
const settings = { brand: "모두", level: "보통", voice: true, count: 10 };
try { Object.assign(settings, JSON.parse(store.get("car-settings2") || "{}")); } catch {}
let game;
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const tagOf = c => `<span class="tag ${c.brand === "현대" ? "h" : "k"}">${c.brand}</span>`;
const pool = () => CARS.filter(c => settings.brand === "모두" || c.brand === settings.brand);

// 화면 바꾸기: 홈이 아니면 위쪽에 🏠 메뉴 버튼이 늘 보여요
function screen(name) {
  stopLearn();
  try { speechSynthesis.cancel(); } catch {}
  const inQuiz = name === "quiz";
  hudQ.hidden = hudScore.hidden = !inQuiz;
  menuBtn.hidden = name === "home";
}
menuBtn.onclick = home;

function segBtns(key, opts, labels) {
  return `<div class="seg" role="group">${opts.map((o, i) => `<button type="button" data-set="${key}" data-val="${o}" aria-pressed="${settings[key] === o}">${labels ? labels[i] : o}</button>`).join("")}</div>`;
}

// ---------- 홈 ----------
function home() {
  screen("home");
  const best = store.get("car-best2") || 0;
  const sample = pool()[Math.floor(Math.random() * pool().length)];
  app.innerHTML = `
    <div class="split">
      <div>
        <div class="stage drive"><img alt="${sample.name}" src="${imgOf(sample)}"></div>
        <p class="question">이 차 이름, 알아맞힐 수 있어?</p>
        <p class="muted center">최고 점수: ⭐ ${best}</p>
      </div>
      <div>
        <div class="setting"><p class="label">회사</p>${segBtns("brand", ["모두", "현대", "기아"])}</div>
        <div class="setting"><p class="label">난이도</p>${segBtns("level", ["쉬움", "보통", "어려움"])}</div>
        <p class="muted">쉬움: 보기 2개 · 보통: 보기 4개 · 어려움: 비슷한 차끼리 4개</p>
        <div class="setting"><p class="label">문제 수</p>${segBtns("count", [5, 10, 20], ["5문제", "10문제", "20문제"])}</div>
        <div class="setting"><p class="label">읽어 주기</p>${segBtns("voice", [true, false], ["켜기", "끄기"])}</div>
        <div class="modes">
          <button class="big primary" id="learnBtn">📖 배우기</button>
          <button class="big go" id="start">🚗 퀴즈!</button>
        </div>
      </div>
    </div>`;
  app.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    let v = b.dataset.val;
    if (v === "true") v = true; else if (v === "false") v = false; else if (/^\d+$/.test(v)) v = +v;
    settings[b.dataset.set] = v; store.set("car-settings2", JSON.stringify(settings));
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  document.getElementById("start").onclick = start;
  document.getElementById("learnBtn").onclick = () => learn(0);
}

// ---------- 퀴즈 ----------
function start() {
  const p = shuffle(pool());
  game = { list: p.slice(0, Math.min(settings.count, p.length)), i: 0, score: 0, streak: 0, right: 0 };
  ask();
}

function distractors(car, n) {
  const others = shuffle(pool().filter(c => c.id !== car.id));
  if (settings.level === "쉬움") {
    // 쉬움: 모양이 다른 차를 보기로
    return [...others.filter(c => c.cat !== car.cat), ...others].slice(0, n);
  }
  const fam = car.fam ? others.filter(c => c.fam === car.fam) : [];
  const sameCat = others.filter(c => c.cat === car.cat);
  const order = settings.level === "어려움" ? [...fam, ...sameCat, ...others] : [...sameCat.slice(0, 1), ...others];
  return [...new Set(order)].slice(0, n);
}

function ask() {
  screen("quiz");
  const car = game.list[game.i];
  const n = settings.level === "쉬움" ? 2 : 4;
  const opts = shuffle([car, ...distractors(car, n - 1)]);
  game.done = false;
  hudQ.textContent = `${game.i + 1}/${game.list.length}`;
  hudScore.textContent = `⭐ ${game.score}`;
  app.innerHTML = `
    <div class="split">
      <div>
        <div class="stage drive"><img alt="문제 자동차" src="${imgOf(car)}"></div>
        <p class="question">이 차는 뭘까?</p>
      </div>
      <div>
        <div class="choices${n === 2 ? " two" : ""}">${opts.map(c => `<button class="choice" data-id="${c.id}">${c.name}</button>`).join("")}</div>
        <p class="feedback" id="fb" aria-live="polite"></p>
        <button class="big primary" id="next" style="visibility:hidden">다음 차 →</button>
      </div>
    </div>`;
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => answer(b, car));
  document.getElementById("next").onclick = () => { game.i++; game.i < game.list.length ? ask() : finish(); };
}

function answer(btn, car) {
  if (game.done) return;
  game.done = true;
  const ok = btn.dataset.id === car.id;
  const fb = document.getElementById("fb");
  app.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.id === car.id) b.classList.add("right");
  });
  if (ok) {
    game.streak++; game.right++;
    const pts = 10 + (game.streak >= 3 ? 5 : 0);
    game.score += pts;
    fb.className = "feedback ok";
    fb.innerHTML = (game.streak >= 3 ? `딩동댕! ${game.streak}연속! +${pts}` : `딩동댕! +${pts}`) + ` ${tagOf(car)}`;
    sndRight(); confetti(); say(`딩동댕! ${car.name}!`);
  } else {
    game.streak = 0;
    btn.classList.add("wrong");
    fb.className = "feedback no";
    fb.innerHTML = `정답은 ${car.name} ${tagOf(car)}`;
    sndWrong(); say(`정답은 ${car.name}`);
  }
  hudScore.textContent = `⭐ ${game.score}`;
  const next = document.getElementById("next");
  next.style.visibility = "visible";
  next.textContent = game.i + 1 < game.list.length ? "다음 차 →" : "결과 보기 🏁";
  next.focus();
}

function finish() {
  screen("finish");
  const total = game.list.length;
  const ratio = game.right / total;
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio >= .3 ? 1 : 0;
  const best = +(store.get("car-best2") || 0);
  const newBest = game.score > best;
  if (newBest) store.set("car-best2", game.score);
  const msg = ["다시 해 보자! 할 수 있어!", "좋아! 조금만 더!", "우와, 자동차 박사네!", "최고! 진짜 자동차 박사님!"][stars];
  app.innerHTML = `
    <div class="finish">
      <p class="question">🏁 도착!</p>
      <div class="stars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>
      <p class="question">${msg}</p>
      <p class="muted">${total}문제 중 ${game.right}개 정답 · 점수 ⭐ ${game.score}${newBest ? " · 새 최고 기록!" : ""}</p>
      <div class="modes">
        <button class="big primary" id="homeBtn">🏠 메뉴</button>
        <button class="big go" id="again">한 번 더!</button>
      </div>
    </div>`;
  if (stars >= 2) confetti();
  say(msg);
  document.getElementById("again").onclick = start;
  document.getElementById("homeBtn").onclick = home;
}

// ---------- 배우기 (한 장씩 넘기기) ----------
let autoTimer = null, keyHandler = null;
function stopLearn() {
  clearInterval(autoTimer); autoTimer = null;
  if (keyHandler) { removeEventListener("keydown", keyHandler); keyHandler = null; }
}
function learn(idx) {
  screen("learn");
  const list = pool();
  const go = i => { idx = (i + list.length) % list.length; show(); };
  app.innerHTML = `
    <div class="split">
      <div><div class="stage" id="lstage"><img id="limg" alt=""></div></div>
      <div>
        <div class="center" style="display:grid;gap:10px">
          <p class="lname" id="lname"></p>
          <div id="ltag"></div>
          <p class="muted" id="lcount"></p>
        </div>
        <div class="lnav">
          <button id="prev" aria-label="이전 차">◀</button>
          <button id="hear" class="primary" aria-label="이름 듣기">🔊 듣기</button>
          <button id="nextc" aria-label="다음 차">▶</button>
        </div>
        <div class="modes">
          <button class="small" id="auto" aria-pressed="false">▶ 자동 넘기기</button>
          <button class="small" id="all">🚘 전체 보기</button>
        </div>
      </div>
    </div>`;
  const stage = document.getElementById("lstage");
  function show() {
    const c = list[idx];
    const img = document.getElementById("limg");
    stage.classList.remove("drive"); void stage.offsetWidth; stage.classList.add("drive");
    img.src = imgOf(c); img.alt = c.name;
    document.getElementById("lname").textContent = c.name;
    document.getElementById("ltag").innerHTML = tagOf(c);
    document.getElementById("lcount").textContent = `${idx + 1} / ${list.length}`;
    say(c.name, true);
  }
  document.getElementById("prev").onclick = () => go(idx - 1);
  document.getElementById("nextc").onclick = () => go(idx + 1);
  document.getElementById("hear").onclick = () => say(list[idx].name, true);
  document.getElementById("all").onclick = () => gallery();
  const auto = document.getElementById("auto");
  auto.onclick = () => {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; auto.textContent = "▶ 자동 넘기기"; auto.setAttribute("aria-pressed", "false"); }
    else { autoTimer = setInterval(() => go(idx + 1), 3500); auto.textContent = "⏸ 멈추기"; auto.setAttribute("aria-pressed", "true"); }
  };
  // 손가락으로 밀어서 넘기기
  let sx = null;
  stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
  });
  stage.onclick = () => say(list[idx].name, true);
  keyHandler = e => { if (e.key === "ArrowRight") go(idx + 1); if (e.key === "ArrowLeft") go(idx - 1); };
  addEventListener("keydown", keyHandler);
  show();
}

// ---------- 전체 보기 ----------
function gallery() {
  screen("gallery");
  const list = pool();
  app.innerHTML = `
    <div class="gwrap">
      <div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <p class="question" style="text-align:left">🚘 전체 보기 <span class="muted">차를 누르면 크게 볼 수 있어요</span></p>
        <button class="small primary" id="back">📖 배우기로</button>
      </div>
      <div class="gallery">${list.map((c, i) => `
        <figure data-i="${i}" tabindex="0"><img alt="${c.name}" src="${imgOf(c)}" loading="lazy">
        <figcaption>${c.name}</figcaption></figure>`).join("")}</div>
    </div>`;
  app.querySelectorAll("figure").forEach(f => {
    f.onclick = () => learn(+f.dataset.i);
    f.onkeydown = e => { if (e.key === "Enter") learn(+f.dataset.i); };
  });
  document.getElementById("back").onclick = () => learn(0);
}

// ---------- 전체 화면 ----------
(function () {
  const btn = document.getElementById("fsBtn");
  const de = document.documentElement;
  const req = de.requestFullscreen || de.webkitRequestFullscreen;
  const standalone = matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches || navigator.standalone;
  if (!req || standalone || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) return;
  btn.hidden = false;
  const isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
  const label = () => { btn.textContent = isFs() ? "✕ 전체 화면 끄기" : "⛶ 전체 화면"; };
  btn.onclick = () => {
    try {
      const p = isFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : req.call(de);
      if (p && p.catch) p.catch(() => { btn.hidden = true; });
    } catch { btn.hidden = true; }
  };
  document.addEventListener("fullscreenchange", label);
  document.addEventListener("webkitfullscreenchange", label);
})();

home();
</script>
